; Display di sincronizzazione (LilyGO T-RGB). Stesso ambiente di display-prova:
; core Arduino ESP32 2.0.x (il core 3.x fa scorrere l'immagine dei display RGB).
; Compilazione:  pio run -d firmware/display-sync -e display      (con tag reali, BLE)
;                pio run -d firmware/display-sync -e demo         (3 tag simulate, senza BLE)
; Caricamento:   pio run -d firmware/display-sync -e display -t upload --upload-port COMx
[platformio]
src_dir = .
boards_dir = boards

[env]
platform = espressif32@6.9.0
board = LilyGo-T-RGB
framework = arduino
board_build.partitions = default_16MB.csv
monitor_speed = 115200
build_src_filter = +<*> -<.pio/> -<boards/>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DDISABLE_ALL_LIBRARY_WARNINGS
lib_deps =
    lewisxhe/SensorLib @ 0.2.3
    adafruit/Adafruit GFX Library @ 1.11.11

[env:display]

[env:demo]
build_flags =
    ${env.build_flags}
    -DSWIM_DEMO=1
