; Display T-RGB con l'ambiente indicato da LilyGO: core Arduino ESP32 2.0.x
; (il core 3.x fa scorrere l'immagine dei display RGB). Il tag resta su arduino-cli.
; Compilazione e caricamento:  pio run -d firmware/display-prova -t upload --upload-port COMx
[platformio]
src_dir = .
boards_dir = boards

[env:display]
platform = espressif32@6.9.0
board = LilyGo-T-RGB
framework = arduino
board_build.partitions = default_16MB.csv
monitor_speed = 115200
build_src_filter = +<*> -<.pio/> -<boards/>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DDISABLE_ALL_LIBRARY_WARNINGS
lib_deps =
    lewisxhe/SensorLib @ 0.2.3
    adafruit/Adafruit GFX Library @ 1.11.11
